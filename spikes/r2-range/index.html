<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spike: R2 range requests + DuckDB-WASM</title>
  </head>
  <body>
    <main>
      <h1>Range-request spike</h1>
      <p class="sub">
        Question: can a browser fetch <em>partial</em> byte ranges of a Parquet file from
        R2-compatible storage, and query it with DuckDB-WASM without downloading the whole file?
      </p>

      <div class="controls">
        <button id="run" type="button">Run all probes</button>
        <label class="delay">
          <input id="reset-log" type="checkbox" checked />
          reset server log between probes
        </label>
      </div>

      <div id="hud" class="hud" aria-live="polite">idle</div>

      <section>
        <h2>Probe results</h2>
        <div id="table"></div>
      </section>

      <section>
        <h2>Log</h2>
        <pre id="report">waiting…</pre>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
